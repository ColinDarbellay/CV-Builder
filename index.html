<!doctype html>
<html lang="en" data-version="202611122108">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>CV Builder</title>
<meta name="theme-color" content="#30302E">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CV Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting desk. Header bar with the current version, pill tabs, one working surface per tab; A4 sheets on a grid table in the preview.
   Single dark theme shared with WA-Trip: warm greys, lilac accent. */
:root{
  --bg:#262624; --panel:#30302E; --sunk:#262624; --ink:#FAF9F5; --muted:#B7B5A9; --line:#3F3E3A; --line-strong:#57554F;
  --navy:#B9A8F5; --navy-ink:#1E1640; --bar:#30302E; --accent:#B9A8F5; --accent-soft:#3B3654;
  --ok:#7FD1AE; --okbg:#22382F; --warn:#F2C14E; --warnbg:#3D3524; --miss:#F09090; --missbg:#3E2626;
  --table:#30302E; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.45);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bar);color:var(--ink);border-bottom:1px solid var(--line);padding-block:10px}
.bar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font:700 15px var(--f-display);letter-spacing:.03em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand small{font:400 11px var(--f-mono);color:var(--muted);letter-spacing:0}
.brand i{width:12px;height:16px;border:2px solid var(--ink);border-right-width:6px;border-radius:2px;display:inline-block}
.vpick{display:flex;gap:8px;align-items:center;flex:1 1 240px;min-width:0}
.vpick select{flex:1;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px}
.save{font:12px var(--f-mono);color:var(--muted);min-width:10ch}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-left:auto}
.who button{background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}

nav.tabs{max-width:1180px;margin:14px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{font:600 14px var(--f-body);background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:8px 16px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
nav.tabs button b{font:500 11.5px var(--f-mono);background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 7px}
nav.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
nav.tabs button[aria-selected="true"] b{background:rgba(30,22,64,.16);color:inherit}

main{max-width:1180px;margin:14px auto 0;padding-bottom:60px}
.pane{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:980px){.cols.ats{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.cols.pv{grid-template-columns:minmax(0,7fr) minmax(300px,4fr)}.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font:600 15px var(--f-display);letter-spacing:.01em;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:400 12px var(--f-mono);color:var(--muted)}
h3{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 0;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input:not([type]),textarea,select{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--sunk);color:var(--ink);font-size:14.5px;min-width:0}
textarea{resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{flex-direction:row;align-items:center;gap:7px;color:var(--ink);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:600}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--navy-ink);font-weight:600}
a{color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.armed{background:var(--missbg);border-color:var(--miss);color:var(--miss)}
.btn:disabled{opacity:.5;cursor:default}

details.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 16px;font:600 14.5px var(--f-display);display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font:400 18px var(--f-mono);color:var(--muted);margin-left:8px}
details.sec[open]>summary::after{content:"−"}
details.sec>summary small{font:400 12px var(--f-mono);color:var(--muted);margin-left:auto}
.sbody{padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.card.off{opacity:.55}
.card input,.card textarea,.card select{background:var(--panel)}
.bul{display:flex;flex-direction:column;gap:6px}
.bul>label{margin-bottom:-2px}
.bi{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:6px;align-items:start}
.bi>span{color:var(--accent);font-weight:700;padding-top:7px;text-align:center}
.bi textarea{resize:none;overflow:hidden;min-height:38px;line-height:1.4}
textarea[data-grow]{resize:none;overflow:hidden;min-height:38px;line-height:1.4}
.bctl{display:flex;gap:4px;margin-top:4px}
.bctl .btn{color:var(--muted);min-width:32px;padding:3px 0}
@media (max-width:620px){.bctl{flex-direction:column}}
.chead{display:flex;align-items:center;gap:6px}
.chead b{flex:1;min-width:0;font:600 14px var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newv{border:1px dashed var(--accent);background:var(--accent-soft)}

/* score */
.score{display:flex;align-items:center;gap:14px}
.pct{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:3.2ch}
.meter{flex:1;height:10px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--ok);transition:width .25s}
.meter.mid>span{background:var(--warn)} .meter.low>span{background:var(--miss)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:3px 10px;font-size:13px;border:1px solid transparent;cursor:pointer;background:var(--sunk);color:var(--ink)}
.chip.ok{color:var(--ok);background:var(--okbg)}
.chip.no{color:var(--miss);background:var(--missbg)}
.chip.hi{font-weight:600}
.chip.hi::before{content:"● ";font-size:9px;vertical-align:2px}
.src{font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps>li{display:flex;flex-direction:column;gap:6px;padding-left:30px;position:relative}
.steps>li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;background:var(--navy);color:var(--navy-ink);font:600 12px/21px var(--f-mono);text-align:center}

.sug{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.sug.done{border-left-color:var(--ok);opacity:.7}
.sug.skip{border-left-color:var(--line);opacity:.55}
.sug .where{font:600 12px var(--f-mono);color:var(--muted)}
.diff{font-size:14px;line-height:1.5;margin:0}
.diff del{background:var(--missbg);color:var(--miss);text-decoration:line-through}
.diff ins{background:var(--okbg);color:var(--ok);text-decoration:none}
.why{font-size:13px;color:var(--muted)}
ul.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
ul.checks li{display:flex;gap:9px;font-size:14px;align-items:baseline}
ul.checks li>span{font:600 11.5px var(--f-mono);min-width:3.2ch;text-align:center;border-radius:4px;padding:1px 4px}
.ok-t{color:var(--ok);background:var(--okbg)} .no-t{color:var(--miss);background:var(--missbg)} .wa-t{color:var(--warn);background:var(--warnbg)}
pre.txt{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:12px;font:12px/1.5 var(--f-mono);margin:0;max-height:52vh;overflow:auto}

/* preview */
.desk{background:var(--table);border-radius:10px;padding:16px;overflow-x:auto;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;min-width:0}
.sheets{display:flex;flex-direction:column;gap:18px;align-items:center}
.sheets.wide{align-items:flex-start}
.zoom{display:flex;gap:4px;align-items:center}
.zoom .btn{min-width:34px;font-family:var(--f-mono)}
#zlabel{min-width:58px}
.sheets canvas{background:#fff;box-shadow:var(--shadow);display:block;flex:none}
.sheets:not(.wide) canvas{max-width:100%}
.ruler{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted);margin-bottom:10px;position:sticky;left:0}

/* applications */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:600;cursor:pointer;font-size:14px}
.fchip span{font-weight:400;color:var(--muted);margin-left:4px;font-size:12.5px;font-family:var(--f-mono)}
.fchip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.fchip.on span{color:inherit;opacity:.75}
.apps{display:flex;flex-direction:column;gap:8px}
.app{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;align-items:center}
.app.cur{border-color:var(--accent)}
.app .t{font:600 15.5px var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .t .star{color:var(--warn);margin-left:6px}
.app .s{font-size:13.5px;color:var(--muted);min-width:0}
.app .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.app .meta select,.app .meta input{width:auto;padding:4px 8px;font-size:13px;border-radius:999px}
.app .acts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.app .more{grid-column:1/-1;display:grid;gap:8px}
.sc{font:600 13px var(--f-mono);border-radius:999px;padding:3px 10px;white-space:nowrap;grid-row:1/3;grid-column:2}
.sc.hi{background:var(--okbg);color:var(--ok)} .sc.mid{background:var(--warnbg);color:var(--warn)} .sc.lo{background:var(--missbg);color:var(--miss)} .sc.na{background:var(--sunk);color:var(--muted)}
.st{font:600 12px var(--f-body);border-radius:999px;padding:3px 10px;border:0}
.st-draft{background:var(--sunk);color:var(--muted)} .st-sent{background:var(--accent-soft);color:var(--accent)} .st-interview{background:var(--warnbg);color:var(--warn)}
.st-offer{background:var(--okbg);color:var(--ok)} .st-rejected{background:var(--missbg);color:var(--miss)} .st-withdrawn{background:var(--sunk);color:var(--muted)}

/* auth + empty */
.center{max-width:440px;margin:40px auto}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.status{font-size:13.5px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.update{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--accent);border-radius:999px;padding:6px 6px 6px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px)}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--sunk)}
@media (max-width:620px){#whoMail{display:none}.save{display:none}.vpick{order:3;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar gut">
  <div class="bar-in">
    <div class="brand"><img src="icon.svg" alt="" width="24" height="24" style="border-radius:6px;display:block">CV Builder <small id="ver" title="Version loaded"></small></div>
    <div class="vpick" id="vpick" hidden><select id="vsel" aria-label="Open version"></select><span class="save" id="save"></span></div>
    <div class="who" id="who" hidden><span id="whoMail"></span><button id="logout">Sign out</button></div>
  </div>
</header>
<div class="gut">
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button role="tab" data-tab="pdf" aria-selected="true">PDF <b id="tabPages">–</b></button>
    <button role="tab" data-tab="edit" aria-selected="false">Edit</button>
    <button role="tab" data-tab="ats" aria-selected="false">ATS <b id="tabScore">–</b></button>
    <button role="tab" data-tab="review" aria-selected="false">Review <b id="tabReview">–</b></button>
    <button role="tab" data-tab="apps" aria-selected="false">Jobs <b id="tabApps">0</b></button>
  </nav>
  <div id="status" class="status" hidden style="max-width:1180px;margin:12px auto 0"></div>
  <main id="main">
    <section id="auth" class="center" hidden></section>
    <section id="first" class="center" hidden></section>
    <section class="pane" id="pane-edit" hidden></section>
    <section class="pane" id="pane-ats" hidden></section>
    <section class="pane" id="pane-review" hidden></section>
    <section class="pane" id="pane-pdf" hidden></section>
    <section class="pane" id="pane-apps" hidden></section>
  </main>
</div>
<input type="file" id="seedIn" accept="application/json,.json" hidden>
<input type="file" id="photoIn" accept="image/*" hidden>
<div class="toast" id="toast" hidden role="status"></div>
<div class="update" id="update" hidden role="status"><span>A new version is available.</span><button class="btn sm acc">Reload</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js?v=202611122108"></script>
<script src="fonts.js?v=202611122108"></script>
<script src="cv-engine.js?v=202611122108"></script>
<script src="app.js?v=202611122108"></script>
</body>
</html>
